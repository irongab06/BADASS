frr defaults traditional
!
! Afficher les journaux dans la sortie du conteneur.
log stdout informational
!
! Utiliser un fichier commun pour les services FRR.
service integrated-vtysh-config
!
! Instance BGP de notre laboratoire.
router bgp 65000
 bgp router-id 1.1.1.1
exit
!
! Instance OSPF de notre laboratoire.
router ospf
 ospf router-id 1.1.1.1
exit
!
